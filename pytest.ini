[pytest]
markers =
    unit: isolated test, all deps mocked, no I/O
    integration: real dependency (e.g. real file/PDF), no external network APIs
    e2e: full pipeline run, request-to-report
    pipeline: multi-step workflow, 3+ internal stages
    smoke: quick health check, always < 30s
    regression: specific known-bad input that once caused a bug (docstring required)
    property: invariant-based/fuzzing style test
    adversarial: deliberate bad/edge/unexpected input, error paths
    authored_claude_opus: authored/reviewed by Claude Opus
    authored_claude_sonnet: authored by Claude Sonnet
    authored_claude_haiku: authored/reviewed by Claude Haiku
    authored_gpt4: authored/reviewed by GPT-4/4o
    authored_gemini_pro: authored/reviewed by Gemini Pro
    authored_human: authored by a human engineer
    multi_model: same scenario independently covered by 2+ model sources
    happy_path: golden path, expected success
    edge_case: boundary, empty, zero, max, off-by-one
    failure_path: expected error, exception, rejection
    concurrent: race conditions, parallel access
